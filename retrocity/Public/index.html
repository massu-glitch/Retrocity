<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro City - MMO</title>
    <!-- MISMO CSS DEL CÓDIGO ORIGINAL -->
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .action-btn {
            position: absolute; width: 65px; height: 65px; bottom: 100px; right: 40px;
            background: rgba(52, 152, 219, 0.4); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center;
            font-weight: bold; pointer-events: auto; cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="action-btn" id="btn-action">ENTRAR<br>SALIR</div>
    </div>

    <!-- SOCKET.IO SCRIPT -->
    <script src="/socket.io/socket.io.js"></script>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// ==========================================
// CONSTANTES Y MAPA (DUPLICADO PARA DIBUJAR)
// ==========================================
const TILE_SIZE = 200;
const TYPES = { GRASS: 0, ROAD: 1, BUILDING: 2, TREE: 3, SIDEWALK: 4, WATER: 5 };

function isTownArea(tx, ty) {
    let rx = Math.floor(tx / 64), ry = Math.floor(ty / 64);
    let hash = Math.abs(Math.sin(rx * 12.9898 + ry * 78.233) * 43758.5453);
    return (hash - Math.floor(hash)) > 0.65;
}
function getRoadType(tx, ty) {
    let isTown = isTownArea(tx, ty);
    let lx = ((tx % 28) + 28) % 28; let ly = ((ty % 28) + 28) % 28;
    let isV = (lx === 0) || (isTown && (lx === 8 || lx === 18));
    let isH = (ly === 0) || (isTown && (ly === 6 || ly === 14 || ly === 22));
    if (isV && isH) return 'INTERSECTION';
    if (isV) return 'VERTICAL';
    if (isH) return 'HORIZONTAL';
    return 'NONE';
}
function getTileType(tx, ty) {
    let road = getRoadType(tx, ty);
    if (road !== 'NONE') return TYPES.ROAD;
    let isTown = isTownArea(tx, ty);
    let hash = Math.abs(Math.sin(tx * 12.989 + ty * 78.233));
    if (isTown) {
        if (hash < 0.1) return TYPES.TREE;
        if (hash < 0.2) return TYPES.SIDEWALK;
        return TYPES.BUILDING;
    } else { return hash < 0.08 ? TYPES.TREE : TYPES.GRASS; }
}

// ==========================================
// CLIENTE MULTIJUGADOR
// ==========================================
const socket = io();
let serverState = null;
let myId = null;
let camera = { x: 2000, y: 2000, zoom: 1.15 };

let keys = { up: false, down: false, left: false, right: false };

socket.on('connect', () => { myId = socket.id; });

socket.on('stateUpdate', (newState) => {
    serverState = newState;
});

// Enviar inputs al servidor
function sendInput() {
    socket.emit('input', keys);
}

window.addEventListener('keydown', e => { 
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = true;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
    if(e.key === 'e' || e.key === 'E') socket.emit('action');
    sendInput();
});
window.addEventListener('keyup', e => { 
    if(e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
    if(e.key === 's' || e.key === 'ArrowDown') keys.down = false;
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    sendInput();
});
document.getElementById('btn-action').addEventListener('click', () => socket.emit('action'));

// ==========================================
// DIBUJO (RENDER LOOP)
// ==========================================
function drawPlayer(ctx, p, isMe) {
    if (p.inVehicle) return; // No dibujar si está en coche
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(0.75, 0.75); ctx.rotate(p.angle);
    ctx.fillStyle = isMe ? '#3498db' : '#95a5a6'; // Yo soy azul, los demás grises
    ctx.beginPath(); ctx.fillRect(-10, -15, 20, 30); ctx.strokeRect(-10, -15, 20, 30);
    ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
}

function drawVehicle(ctx, v) {
    ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(v.angle);
    ctx.fillStyle = v.color;
    ctx.fillRect(-30, -14, 60, 28);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-15, -11, 30, 22);
    ctx.restore();
}

function loop() {
    requestAnimationFrame(loop);
    if (!serverState || !myId) return;

    let me = serverState.players[myId];
    if (me) {
        // Suavizar movimiento de cámara hacia el jugador
        camera.x += (me.x - camera.x) * 0.1;
        camera.y += (me.y - camera.y) * 0.1;
    }

    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, width, height); 
    ctx.save();
    ctx.translate(width / 2, height / 2); 
    ctx.scale(camera.zoom, camera.zoom); 
    ctx.translate(-camera.x, -camera.y);

    // Dibujar Suelo (Igual que el original)
    let viewW = width / camera.zoom; let viewH = height / camera.zoom;
    let startTx = Math.floor((camera.x - viewW/2) / TILE_SIZE);
    let endTx = Math.ceil((camera.x + viewW/2) / TILE_SIZE);
    let startTy = Math.floor((camera.y - viewH/2) / TILE_SIZE);
    let endTy = Math.ceil((camera.y + viewH/2) / TILE_SIZE);

    for (let ty = startTy; ty <= endTy; ty++) {
        for (let tx = startTx; tx <= endTx; tx++) {
            let px = tx * TILE_SIZE, py = ty * TILE_SIZE;
            let type = getTileType(tx, ty); 

            if (type === TYPES.ROAD) {
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1); 
            } else if (type === TYPES.SIDEWALK) {
                ctx.fillStyle = '#bdc3c7'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
            } else if (type === TYPES.BUILDING) {
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1); 
            } else if (type === TYPES.WATER) {
                ctx.fillStyle = '#2980b9'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
            } else if (type === TYPES.TREE) {
                ctx.fillStyle = '#27ae60'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
            } else if (type === TYPES.GRASS) {
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
            }
        }
    }

    // Dibujar Vehículos
    for (let v of serverState.vehicles) drawVehicle(ctx, v);

    // Dibujar Jugadores
    for (let id in serverState.players) {
        drawPlayer(ctx, serverState.players[id], id === myId);
    }

    ctx.restore();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
