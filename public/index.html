<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro City - Mundo Asimétrico y Curvas</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #zoom-controls {
            position: absolute; top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto; z-index: 20;
        }
        .zoom-btn {
            position: relative; width: 45px; height: 45px;
            font-size: 26px; border-radius: 8px;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px #000; cursor: pointer;
        }
        .zoom-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }

        #hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.6); color: #fff;
            padding: 10px; border-radius: 8px; border: 2px solid #555;
            text-align: right; pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .bar-container {
            width: 150px; height: 15px; background: #333;
            border-radius: 4px; overflow: hidden; margin-top: 5px; border: 1px solid #000;
        }
        #health-bar { width: 100%; height: 100%; background: #e74c3c; transition: width 0.2s; }
        #stamina-bar { width: 100%; height: 100%; background: #3498db; transition: width 0.1s; } 
        #wanted-stars { color: #f1c40f; font-size: 20px; letter-spacing: 2px; text-shadow: 1px 1px 2px #000; min-height: 24px; }
        
        #minimap-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 130px; height: 130px; border: 4px solid #444; border-radius: 50%;
            overflow: hidden; background: #1a1a1a; opacity: 0.85; pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #minimap { width: 100%; height: 100%; }

        .touch-zone { position: absolute; bottom: 0; width: 50%; height: 50%; pointer-events: auto; z-index: 20; }
        #left-touch { left: 0; } #right-touch { right: 0; }
        
        .joystick-base {
            position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: none; pointer-events: none;
        }
        .joystick-knob {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        #dpad {
            display: none; position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; z-index: 20; pointer-events: auto;
        }
        .dpad-btn {
            position: absolute; width: 45px; height: 45px;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px #000; user-select: none;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
        #btn-up { top: 0; left: 47.5px; }
        #btn-down { bottom: 0; left: 47.5px; }
        #btn-left { top: 47.5px; left: 0; }
        #btn-right { top: 47.5px; right: 0; }

        .action-btn {
            position: absolute; width: 65px; height: 65px;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; color: white; font-weight: bold;
            display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px #000; transition: background 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        #btn-shoot { bottom: 40px; right: 120px; background: rgba(231, 76, 60, 0.4); display: none !important; }
        #btn-action { bottom: 100px; right: 40px; background: rgba(52, 152, 219, 0.4); }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(44,62,80,0.95) 0%, rgba(0,0,0,0.95) 100%);
            color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center;
        }
        #start-screen h1 { font-size: 3rem; color: #f1c40f; text-shadow: 3px 3px 0 #e74c3c; margin-bottom: 10px; }
        #start-screen button {
            padding: 15px 40px; font-size: 22px; font-family: inherit; font-weight: bold;
            background: #e74c3c; color: white; border: 2px solid #c0392b; border-radius: 8px; cursor: pointer; margin-top: 30px;
            box-shadow: 0 5px 0 #c0392b; transition: all 0.1s;
        }
        #start-screen button:active { transform: translateY(5px); box-shadow: none; }
        
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(255,0,0,0); pointer-events: none; z-index: 5; transition: box-shadow 0.2s;
        }

        #job-menu {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.95); padding: 20px; border: 2px solid #3498db; 
            color: white; border-radius: 12px; z-index: 100; max-height: 85%; overflow-y: auto; width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: auto; font-family: 'Courier New', Courier, monospace;
        }
        #job-menu h2 { margin-top: 0; color: #3498db; text-align: center; }
        .job-item { padding: 10px; margin-bottom: 8px; background: #2c3e50; border-radius: 6px; cursor: pointer; border: 1px solid #34495e; transition: 0.1s; }
        .job-item:active { transform: scale(0.98); }
        .job-item.locked { opacity: 0.4; cursor: not-allowed; }
        .job-item.locked:active { transform: none; }
        
        #working-overlay {
            display: none; position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 8px; color: #fff; text-align: center;
            z-index: 90; border: 2px solid #f1c40f; box-shadow: 0 0 15px rgba(0,0,0,0.8); font-size: 18px; font-weight: bold;
        }
        #working-bar-container { width: 250px; height: 18px; background: #222; border: 1px solid #fff; margin-top: 10px; border-radius: 4px; overflow: hidden; }
        #working-bar { width: 0%; height: 100%; background: #f1c40f; }
        #btn-close-jobs { width: 100%; padding: 10px; margin-top: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        #interaction-prompt {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(52, 152, 219, 0.9); color: white; padding: 10px 20px; border-radius: 8px;
            font-weight: bold; display: none; text-align: center; pointer-events: none;
            border: 2px solid white; z-index: 50; text-shadow: 1px 1px 2px #000; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        @media (hover: hover) and (pointer: fine) { .touch-zone, .joystick-base, #dpad { display: none !important; } }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>RETRO CITY MMO</h1>
        <p>Pilotos en Motos, Trabajos, GPS y Físicas.</p>
        <p style="color: #bdc3c7;">PC: WASD mover, SHIFT correr, E Acción/Vehículo.</p>
        <button id="start-btn">JUGAR</button>
    </div>

    <div id="damage-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="zoom-controls">
            <div class="zoom-btn" id="btn-zoom-in">+</div>
            <div class="zoom-btn" id="btn-zoom-out">-</div>
            <div class="zoom-btn" id="job-btn" style="background: rgba(52, 152, 219, 0.7); font-size: 20px;">💼</div>
        </div>

        <div id="hud">
            <div id="money-display" style="color: #2ecc71; font-weight: bold; font-size: 24px; margin-bottom: 5px; text-shadow: 1px 1px 2px #000;">$0</div>
            <div id="wanted-stars"></div>
            <div class="bar-container"><div id="health-bar"></div></div>
            <div class="bar-container"><div id="stamina-bar"></div></div>
        </div>
        <div id="minimap-container"><canvas id="minimap"></canvas></div>
        
        <div id="interaction-prompt">🏢 AGENCIA DE EMPLEO<br><span style="font-size:12px">Usa la tecla 'E' o el botón ACCIÓN</span></div>
        
        <div id="dpad">
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-right">▶</div>
        </div>
    </div>

    <div id="job-menu"></div>
    <div id="working-overlay">
        <div id="working-title">Trabajando...</div>
        <div id="working-bar-container"><div id="working-bar"></div></div>
    </div>

    <div class="touch-zone" id="left-touch">
        <div class="joystick-base" id="joystick"><div class="joystick-knob" id="knob"></div></div>
    </div>
    <div class="touch-zone" id="right-touch">
        <div class="action-btn" id="btn-shoot">DISPARAR</div>
        <div class="action-btn" id="btn-action">ENTRAR<br>SALIR</div>
    </div>

<script>
// ==========================================
// CONSTANTES Y BASE DE DATOS
// ==========================================
const TILE_SIZE = 200; 
const TYPES = { GRASS: 0, ROAD: 1, BUILDING: 2, TREE: 3, SIDEWALK: 4, WATER: 5 };
const VEHICLE_COLORS = ['#e74c3c', '#2ecc71', '#9b59b6', '#34495e', '#ecf0f1', '#1abc9c', '#d35400', '#7f8c8d'];
const BUILDING_COLORS = ['#2c3e50', '#8e44ad', '#d35400', '#c0392b', '#16a085', '#2c2c54'];
const HQ_OVERRIDES = {}; 

const XP_REQ = [0, 100, 300, 600, 1000, 999999]; 

const JOBS = [
    { id: 'pizza', name: 'Repartidor de Pizza', level: 1, pay: 15, xp: 15, time: 3, vType: 'MOTO', vColor: '#e74c3c' },
    { id: 'cleaner', name: 'Serv. de Limpieza', level: 1, pay: 20, xp: 20, time: 60, vType: 'SUV', vColor: '#ecf0f1' },
    { id: 'lumberjack', name: 'Leñador', level: 2, pay: 40, xp: 30, time: 5, vType: 'TRUCK', vColor: '#d35400' },
    { id: 'farmer', name: 'Agricultor', level: 2, pay: 35, xp: 28, time: 5, vType: 'QUAD', vColor: '#27ae60' },
    { id: 'office', name: 'Oficinista', level: 3, pay: 70, xp: 50, time: 6, vType: 'SEDAN', vColor: '#95a5a6' },
    { id: 'electrician', name: 'Electricista', level: 3, pay: 80, xp: 60, time: 7, vType: 'SUV', vColor: '#3498db' },
    { id: 'taxi', name: 'Taxista', level: 4, pay: 140, xp: 80, time: 8, vType: 'TAXI', vColor: '#f1c40f' },
    { id: 'trucker', name: 'Camionero', level: 4, pay: 160, xp: 90, time: 9, vType: 'TRUCK', vColor: '#2980b9' },
    { id: 'mechanic', name: 'Mecánico', level: 5, pay: 250, xp: 120, time: 10, vType: 'TRUCK', vColor: '#7f8c8d' },
    { id: 'doctor', name: 'Médico', level: 5, pay: 300, xp: 150, time: 11, vType: 'SEDAN', vColor: '#ecf0f1' },
    { id: 'police', name: 'Policía', level: 5, pay: 280, xp: 130, time: 10, vType: 'POLICE', vColor: '#111111' }
];

const VEHICLE_DEFS = {
    SEDAN:  { w: 60,  h: 28, maxSpeed: 650, accel: 450, friction: 150, grip: 1.0, hp: 300, mass: 1.0, colors: VEHICLE_COLORS },
    SPORTS: { w: 62,  h: 26, maxSpeed: 950, accel: 700, friction: 120, grip: 0.8, hp: 250, mass: 0.9, colors: ['#e74c3c', '#f1c40f', '#2980b9'] },
    POLICE: { w: 60,  h: 28, maxSpeed: 900, accel: 650, friction: 180, grip: 1.2, hp: 400, mass: 1.2, colors: ['#111111'] },
    TAXI:   { w: 60,  h: 28, maxSpeed: 600, accel: 400, friction: 150, grip: 1.0, hp: 300, mass: 1.0, colors: ['#f1c40f'] },
    SUV:    { w: 68,  h: 32, maxSpeed: 550, accel: 350, friction: 200, grip: 1.1, hp: 450, mass: 1.5, colors: VEHICLE_COLORS },
    TRUCK:  { w: 120, h: 36, maxSpeed: 400, accel: 200, friction: 250, grip: 0.7, hp: 800, mass: 3.5, colors: ['#bdc3c7', '#34495e', '#7f8c8d'] },
    MOTO:   { w: 32,  h: 12, maxSpeed: 850, accel: 800, friction: 100, grip: 1.4, hp: 100, mass: 0.3, colors: VEHICLE_COLORS },
    QUAD:   { w: 35,  h: 22, maxSpeed: 650, accel: 700, friction: 220, grip: 1.5, hp: 150, mass: 0.5, colors: ['#27ae60', '#e67e22', '#c0392b'] }
};

const SPAWN_POOL = ['SEDAN','SEDAN','SEDAN','SEDAN','SUV','SUV','SUV','TAXI','TAXI','TRUCK','TRUCK','MOTO','MOTO','QUAD','SPORTS','SPORTS','POLICE'];

// ==========================================
// MOTOR Y ESTADO
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

let width, height;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const Game = {
    vehicles: [], npcs: [], bullets: [], player: null,
    camera: { x: 0, y: 0, zoom: 1.15, zoomTarget: 1.15, offsetX: 0, offsetY: 0 },
    timeOfDay: 12.0, wantedLevel: 0, keys: {}, joystick: { x: 0, y: 0, active: false }, lastTime: 0,
    jobAgencyLoc: null 
};

// ==========================================
// MAPA Y NAVEGACIÓN (DETERMINISTA PARA MULTIJUGADOR)
// ==========================================
function isTownArea(tx, ty) {
    let rx = Math.floor(tx / 64), ry = Math.floor(ty / 64);
    let hash = Math.abs(Math.sin(rx * 12.9898 + ry * 78.233) * 43758.5453);
    return (hash - Math.floor(hash)) > 0.65; 
}
function getRoadType(tx, ty) {
    let isTown = isTownArea(tx, ty);
    let lx = ((tx % 28) + 28) % 28; let ly = ((ty % 28) + 28) % 28;
    let isMainV = (lx === 0); let isMainH = (ly === 0);
    let isWindingH = !isTown && (ly === 14) && (lx > 0 && lx <= 14);
    let isWindingV = !isTown && (lx === 14) && (ly >= 14 && ly < 28);
    let isTownV = isTown && (lx === 8 || lx === 18);
    let isTownH = isTown && (ly === 6 || ly === 14 || ly === 22);
    let isV = isMainV || isTownV || isWindingV;
    let isH = isMainH || isTownH || isWindingH;
    
    if (isV && isH) return 'INTERSECTION';
    if (isV) return 'VERTICAL';
    if (isH) return 'HORIZONTAL';
    return 'NONE';
}
function getTileType(tx, ty) {
    let key = tx + ',' + ty;
    if (HQ_OVERRIDES[key] !== undefined) return HQ_OVERRIDES[key]; 

    let road = getRoadType(tx, ty);
    if (road !== 'NONE') return TYPES.ROAD;
    let isTown = isTownArea(tx, ty);
    let hash = Math.abs(Math.sin(tx * 12.989 + ty * 78.233));
    if (isTown) {
        let nearRoad = getRoadType(tx+1, ty)!=='NONE' || getRoadType(tx-1, ty)!=='NONE' || 
                       getRoadType(tx, ty+1)!=='NONE' || getRoadType(tx, ty-1)!=='NONE';
        if (nearRoad) return TYPES.SIDEWALK;
        if (hash < 0.1) return TYPES.TREE;
        if (hash < 0.2) return TYPES.SIDEWALK;
        return TYPES.BUILDING;
    } else {
        let lakeNoise = Math.sin(tx/4) + Math.cos(ty/4) + Math.sin((tx+ty)/6);
        if (lakeNoise > 1.4) return TYPES.WATER;
        if (hash < 0.08) return TYPES.TREE; 
        return TYPES.GRASS;
    }
}
function getTile(x, y) { return getTileType(Math.floor(x / TILE_SIZE), Math.floor(y / TILE_SIZE)); }

function findBuildingEntrance(cx, cy, minRadiusPx = 0) {
    let tx = Math.floor(cx / TILE_SIZE);
    let ty = Math.floor(cy / TILE_SIZE);
    let startRadius = Math.max(1, Math.floor(minRadiusPx / TILE_SIZE));
    
    for(let r = startRadius; r < startRadius + 40; r++) {
        for(let tries = 0; tries < 25; tries++) {
            let ang = (tries * 137.5) * (Math.PI / 180); // CÁLCULO DETERMINISTA
            let testX = tx + Math.floor(Math.cos(ang) * r);
            let testY = ty + Math.floor(Math.sin(ang) * r);
            
            if (getTileType(testX, testY) === TYPES.SIDEWALK) {
                let offX = 0, offY = 0;
                if (getTileType(testX+1, testY) === TYPES.BUILDING) offX = 85;
                else if (getTileType(testX-1, testY) === TYPES.BUILDING) offX = -85;
                else if (getTileType(testX, testY+1) === TYPES.BUILDING) offY = 85;
                else if (getTileType(testX, testY-1) === TYPES.BUILDING) offY = -85;
                
                if (offX !== 0 || offY !== 0) {
                    return { x: testX * TILE_SIZE + TILE_SIZE/2 + offX, y: testY * TILE_SIZE + TILE_SIZE/2 + offY };
                }
            }
        }
    }
    return { x: cx, y: cy }; 
}

function findCampoPoint(cx, cy, minRadiusPx = 0, preferredType = TYPES.GRASS) {
    let tx = Math.floor(cx / TILE_SIZE);
    let ty = Math.floor(cy / TILE_SIZE);
    let startRadius = Math.max(1, Math.floor(minRadiusPx / TILE_SIZE));
    
    for(let r = startRadius; r < startRadius + 40; r++) {
        for(let tries = 0; tries < 25; tries++) {
            let ang = (tries * 137.5) * (Math.PI / 180); // CÁLCULO DETERMINISTA
            let testX = tx + Math.floor(Math.cos(ang) * r);
            let testY = ty + Math.floor(Math.sin(ang) * r);
            
            if (!isTownArea(testX, testY) && getTileType(testX, testY) === preferredType) {
                let rX = (Math.sin(testX * 1.23) - 0.5) * 100;
                let rY = (Math.cos(testY * 3.21) - 0.5) * 100;
                return { x: testX * TILE_SIZE + TILE_SIZE/2 + rX, y: testY * TILE_SIZE + TILE_SIZE/2 + rY };
            }
        }
    }
    return { x: cx, y: cy };
}

function findNearestRoad(cx, cy) {
    let tx = Math.floor(cx / TILE_SIZE);
    let ty = Math.floor(cy / TILE_SIZE);
    for(let r = 1; r < 20; r++) {
        for(let tries = 0; tries < 15; tries++) {
            let ang = (tries * 137.5) * (Math.PI / 180);
            let testX = tx + Math.floor(Math.cos(ang) * r);
            let testY = ty + Math.floor(Math.sin(ang) * r);
            if (getTileType(testX, testY) === TYPES.ROAD) {
                return { x: testX * TILE_SIZE + TILE_SIZE/2, y: testY * TILE_SIZE + TILE_SIZE/2 };
            }
        }
    }
    return { x: cx + TILE_SIZE*2, y: cy }; 
}

function getSafeParkingCoords(cx, cy) {
    let tx = Math.floor(cx / TILE_SIZE);
    let ty = Math.floor(cy / TILE_SIZE);
    for(let r = 1; r < 20; r++) {
        for(let tries = 0; tries < 20; tries++) {
            let ang = (tries * 137.5) * (Math.PI / 180);
            let testX = tx + Math.floor(Math.cos(ang) * r);
            let testY = ty + Math.floor(Math.sin(ang) * r);
            let roadType = getRoadType(testX, testY);
            
            if (roadType === 'HORIZONTAL') {
                let goRight = (testX % 2 === 0);
                return { x: testX * TILE_SIZE + TILE_SIZE/2, y: testY * TILE_SIZE + (goRight ? 175 : 25), angle: goRight ? 0 : Math.PI };
            } else if (roadType === 'VERTICAL') {
                let goDown = (testY % 2 === 0);
                return { x: testX * TILE_SIZE + (goDown ? 25 : 175), y: testY * TILE_SIZE + TILE_SIZE/2, angle: goDown ? Math.PI/2 : -Math.PI/2 };
            }
        }
    }
    return { x: cx + 60, y: cy + 60, angle: 0 };
}

function findSafeSpawn(baseX, baseY) {
    let cx = Math.floor(baseX / TILE_SIZE); let cy = Math.floor(baseY / TILE_SIZE);
    for(let r = 0; r < 100; r++) {
        for(let ty = cy - r; ty <= cy + r; ty++) {
            for(let tx = cx - r; tx <= cx + r; tx++) {
                if (isTownArea(tx, ty) && getTileType(tx, ty) === TYPES.SIDEWALK) return { x: tx * TILE_SIZE + TILE_SIZE/2, y: ty * TILE_SIZE + TILE_SIZE/2 };
            }
        }
    }
    return { x: 12 * TILE_SIZE, y: 12 * TILE_SIZE };
}

function generateJobHQs() {
    let i = 1;
    for(let job of JOBS) {
        if (job.id === 'farmer' || job.id === 'lumberjack') {
            let hqTile = findCampoPoint(i * 4000, i * 4000, 0, job.id === 'farmer' ? TYPES.GRASS : TYPES.TREE);
            let hqTx = Math.floor(hqTile.x / TILE_SIZE);
            let hqTy = Math.floor(hqTile.y / TILE_SIZE);
            HQ_OVERRIDES[hqTx + ',' + (hqTy - 1)] = TYPES.BUILDING;
            job.hq = { x: hqTx * TILE_SIZE + TILE_SIZE/2, y: hqTy * TILE_SIZE + TILE_SIZE/2 - 85 };
        } else {
            job.hq = findBuildingEntrance(i * 4000, i * 4000, 0);
        }
        i++;
    }
    Game.jobAgencyLoc = findBuildingEntrance(2000, 2000, 0);
}

function getTaskLocation(jobId, x, y) {
    if (jobId === 'farmer') return findCampoPoint(x, y, 1000, TYPES.GRASS);
    if (jobId === 'lumberjack') return findCampoPoint(x, y, 1000, TYPES.TREE);
    if (jobId === 'pizza' || jobId === 'cleaner') return findBuildingEntrance(x, y, 4000);
    return findBuildingEntrance(x, y, 1000);
}

function collideWithWalls(ent, dt) {
    let isVeh = ent instanceof Vehicle;
    let boxes = isVeh ? ent.getHitboxes() : [{ x: ent.x, y: ent.y, r: ent.radius }];
    let collided = false;
    for (let box of boxes) {
        let tx = Math.floor(box.x / TILE_SIZE); let ty = Math.floor(box.y / TILE_SIZE);
        for(let y = ty - 1; y <= ty + 1; y++) {
            for(let x = tx - 1; x <= tx + 1; x++) {
                let type = getTileType(x, y);
                if (type === TYPES.BUILDING || type === TYPES.WATER) {
                    let tL = x * TILE_SIZE, tR = tL + TILE_SIZE;
                    let tT = y * TILE_SIZE, tB = tT + TILE_SIZE;
                    let testX = box.x; let testY = box.y;
                    if (box.x < tL) testX = tL; else if (box.x > tR) testX = tR;
                    if (box.y < tT) testY = tT; else if (box.y > tB) testY = tB;
                    let distX = box.x - testX, distY = box.y - testY;
                    let distance = Math.hypot(distX, distY);
                    if (distance === 0) { distX = 1; distance = 1; }
                    if (distance < box.r) {
                        let push = box.r - distance; let nx = distX / distance; let ny = distY / distance;
                        ent.x += nx * push; ent.y += ny * push; box.x += nx * push; box.y += ny * push;
                        collided = true;
                        if (isVeh && Math.abs(ent.speed) > 50) {
                            let dmg = Math.abs(ent.speed) * 0.2 * dt; ent.hp -= dmg;
                            ent.addDent(box.x - nx * box.r, box.y - ny * box.r, dmg * 5);
                            ent.speed *= 0.9; if (ent.hp <= 0) ent.isBroken = true;
                        }
                    }
                }
            }
        }
    }
}

// ==========================================
class Entity {
    constructor(x, y, radius, id=null) {
        this.id = id || Math.random().toString(36).substr(2, 9);
        this.x = x; this.y = y; this.radius = radius;
        this.vx = 0; this.vy = 0; this.angle = 0;
        this.active = true; this.hp = 100;
    }
    update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; }
}

class Person extends Entity {
    constructor(x, y, isPlayer = false, id=null) {
        super(x, y, 11.5, id); 
        this.isPlayer = isPlayer; 
        this.speed = 100;
        this.color = isPlayer ? '#3498db' : '#95a5a6';
        this.state = 'wander'; this.timer = Math.random() * 2;
        this.isPolice = false; this.inVehicle = null;
        this.enteringVehicle = null; this.enterTimer = 0; 
        this.hasWeapon = isPlayer ? false : true; 
        this.stamina = 100; this.maxStamina = 100; this.exhausted = false; 
        
        if (isPlayer) {
            this.money = 0; this.jobLevel = 1; this.jobXp = 0;
            this.isWorking = false; this.workTimer = 0;
            this.currentJob = null; this.jobState = 'NONE';
            this.targetLoc = null; this.jobData = {};
        }

        if (!isPlayer) Game.npcs.push(this);
    }
    
    update(dt) {
        if (!this.active) return;

        if (this.isPlayer && this.inVehicle) {
            this.x = this.inVehicle.x;
            this.y = this.inVehicle.y;
        }

        if (this.isPlayer && this.isWorking) {
            this.workTimer -= dt;
            let totalTime = this.currentJob.time;
            let pct = 1 - (this.workTimer / totalTime);
            document.getElementById('working-bar').style.width = (pct * 100) + '%';
            
            if (this.workTimer <= 0) {
                this.isWorking = false;
                document.getElementById('working-overlay').style.display = 'none';
                
                this.money += this.currentJob.pay;
                this.jobXp += this.currentJob.xp;
                if (this.jobLevel < 5 && this.jobXp >= XP_REQ[this.jobLevel]) this.jobLevel++;
                
                this.jobData.tasksDone++;
                if (this.jobData.tasksDone >= 5) {
                    this.jobState = 'GO_TO_HQ';
                    this.targetLoc = this.currentJob.hq;
                } else {
                    this.jobState = 'GO_TO_TASK';
                    this.targetLoc = getTaskLocation(this.currentJob.id, this.x, this.y);
                }
            }
            this.vx = 0; this.vy = 0; 
            if (!this.inVehicle) super.update(dt);
            return; 
        }

        if (this.isPlayer && this.currentJob && !this.isWorking) {
            let dist = this.targetLoc ? Math.hypot(this.targetLoc.x - this.x, this.targetLoc.y - this.y) : 9999;
            
            if (this.jobState !== 'GO_TO_HQ' && this.jobData.vehicle && this.jobData.vehicle.isBroken) {
                this.currentJob = null; this.jobState = 'NONE'; this.targetLoc = null;
            } else {
                if (this.jobState === 'GO_TO_HQ' && dist < 45 && !this.inVehicle) {
                    let pCoords = getSafeParkingCoords(this.x, this.y);
                    if (!this.jobData.vehicle || this.jobData.vehicle.isBroken) {
                        let v = new Vehicle(pCoords.x, pCoords.y, this.currentJob.vType);
                        v.color = this.currentJob.vColor;
                        v.angle = pCoords.angle;
                        v.isParked = true; v.speed = 0;
                        this.jobData.vehicle = v;
                    } else {
                        this.jobData.vehicle.x = pCoords.x;
                        this.jobData.vehicle.y = pCoords.y;
                        this.jobData.vehicle.angle = pCoords.angle;
                        this.jobData.vehicle.speed = 0;
                        this.jobData.vehicle.vx = 0;
                        this.jobData.vehicle.vy = 0;
                    }
                    
                    this.inVehicle = this.jobData.vehicle;
                    this.inVehicle.isParked = false;
                    this.inVehicle.locked = false;
                    this.x = this.inVehicle.x;
                    this.y = this.inVehicle.y;

                    this.jobData.tasksDone = 0;
                    this.jobState = 'GO_TO_TASK';
                    this.targetLoc = getTaskLocation(this.currentJob.id, this.x, this.y);
                }
                else if (this.jobState === 'GO_TO_TASK' && dist < 45 && !this.inVehicle) {
                    this.isWorking = true;
                    this.workTimer = this.currentJob.time; 
                    document.getElementById('working-overlay').style.display = 'block';
                    document.getElementById('working-title').innerText = `Trabajando de ${this.currentJob.name}...`;
                    document.getElementById('working-bar').style.width = '0%';
                }
            }
        }

        if (this.enterTimer > 0) {
            this.enterTimer -= dt;
            if (this.enterTimer <= 0 && this.enteringVehicle) {
                if (this.enteringVehicle.active && !this.enteringVehicle.isBroken) {
                    this.inVehicle = this.enteringVehicle;
                    this.inVehicle.speed = 0;
                    this.inVehicle.isParked = false;
                    this.inVehicle.locked = false; 
                }
                this.enteringVehicle = null;
            }
            return;
        }

        if (this.isPlayer) {
            if (this.inVehicle) {
                if (this.stamina < this.maxStamina) { this.stamina += 20 * dt; if (this.stamina > this.maxStamina) this.stamina = this.maxStamina; }
                if (this.stamina > 20) this.exhausted = false;
                return; 
            }
            let moveX = 0, moveY = 0;
            if (Game.keys['ArrowLeft'] || Game.keys['a']) moveX -= 1;
            if (Game.keys['ArrowRight'] || Game.keys['d']) moveX += 1;
            if (Game.keys['ArrowUp'] || Game.keys['w']) moveY -= 1;
            if (Game.keys['ArrowDown'] || Game.keys['s']) moveY += 1;
            if (Game.joystick.active) { moveX = Game.joystick.x; moveY = Game.joystick.y; }
            
            let isMoving = (moveX !== 0 || moveY !== 0);
            let mobileSprint = (Game.joystick.active && Math.hypot(Game.joystick.x, Game.joystick.y) > 0.8);
            if (this.stamina <= 0) this.exhausted = true;
            if (this.stamina > 20) this.exhausted = false;
            let isSprinting = ((Game.keys['Shift'] || mobileSprint) && isMoving && !this.exhausted && this.stamina > 0);

            if (isSprinting) { this.speed = 180; this.stamina -= 25 * dt; if (this.stamina < 0) this.stamina = 0; } 
            else { this.speed = 100; if (this.stamina < this.maxStamina) { this.stamina += 15 * dt; if (this.stamina > this.maxStamina) this.stamina = this.maxStamina; } }

            let len = Math.hypot(moveX, moveY);
            if (len > 1) { moveX /= len; moveY /= len; }
            this.vx = moveX * this.speed; this.vy = moveY * this.speed;
            if (len > 0.1) this.angle = Math.atan2(moveY, moveX);
        } else if (isHost) { // SOLO EL HOST MUEVE A LOS PEATONES
            this.timer -= dt;
            if (this.isPolice) {
                if (Game.wantedLevel > 0) {
                    let target = Game.player.inVehicle ? Game.player.inVehicle : Game.player;
                    let dx = target.x - this.x; let dy = target.y - this.y;
                    let targetAngle = Math.atan2(dy, dx);
                    this.speed = 110;
                    this.vx = Math.cos(targetAngle) * this.speed; this.vy = Math.sin(targetAngle) * this.speed;
                    this.angle = targetAngle;
                } else {
                    if (this.timer <= 0) { this.angle = Math.random() * Math.PI * 2; this.timer = 1 + Math.random() * 3; }
                    this.vx = Math.cos(this.angle) * 35; this.vy = Math.sin(this.angle) * 35;
                }
            } else {
                if (this.state === 'wander') {
                    if (this.timer <= 0) { this.angle = Math.random() * Math.PI * 2; this.timer = 1 + Math.random() * 3; }
                    
                    let lookX = this.x + Math.cos(this.angle) * 30;
                    let lookY = this.y + Math.sin(this.angle) * 30;
                    if (getTile(lookX, lookY) === TYPES.ROAD) {
                        this.angle += Math.PI; 
                        this.timer = 1 + Math.random(); 
                    }
                    
                    this.vx = Math.cos(this.angle) * 35; this.vy = Math.sin(this.angle) * 35;
                    if (Game.player.inVehicle && Math.hypot(this.x - Game.player.inVehicle.x, this.y - Game.player.inVehicle.y) < 200) { this.state = 'flee'; this.timer = 2; }
                } else if (this.state === 'flee') {
                    let target = Game.player.inVehicle ? Game.player.inVehicle : Game.player;
                    this.angle = Math.atan2(this.y - target.y, this.x - target.x);
                    this.vx = Math.cos(this.angle) * 105; this.vy = Math.sin(this.angle) * 105;
                    if (this.timer <= 0) this.state = 'wander';
                }
            }
        }
        
        if (!this.inVehicle) super.update(dt);
        if (!this.inVehicle) collideWithWalls(this, dt); 

        for (let i = 0; i < Game.vehicles.length; i++) {
            let v = Game.vehicles[i];
            if (!v.active || this.inVehicle === v) continue;
            let hitboxes = v.getHitboxes();
            for (let circle of hitboxes) {
                let dx = this.x - circle.x; let dy = this.y - circle.y;
                let dist = Math.hypot(dx, dy);
                if (dist === 0) { dx = 1; dist = 1; } 
                if (dist < this.radius + circle.r) {
                    if (Math.abs(v.speed) > 100) {
                        this.active = false;
                        if (!this.isPolice && !this.isPlayer && Game.player.inVehicle === v) Game.wantedLevel += 0.5;
                    } else {
                        let overlap = (this.radius + circle.r) - dist;
                        this.x += (dx / dist) * overlap; this.y += (dy / dist) * overlap;
                    }
                }
            }
        }
    }
    
    drawShadow(ctx) {
        if (!this.active || this.inVehicle) return;
        if (this.isPlayer && this.isWorking) return; 
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(0.75, 0.75); 
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.arc(3, 5, 12, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    draw(ctx) {
        if (!this.active || this.inVehicle) return;
        if (this.isPlayer && this.isWorking) return; 
        
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(0.75, 0.75); ctx.rotate(this.angle);
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#111';
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.fillRect(-10, -15, 20, 30); ctx.strokeRect(-10, -15, 20, 30);
        ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, 15, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, -15, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        if (this.enterTimer > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(-15, -25, 30, 6);
            ctx.fillStyle = '#f1c40f'; let pct = 1 - (this.enterTimer / 0.8); ctx.fillRect(-14, -24, 28 * pct, 4);
        }
        ctx.restore();
    }
}

class Vehicle extends Entity {
    constructor(x, y, vType, id=null) {
        super(x, y, 30, id); 
        let def = VEHICLE_DEFS[vType];
        this.vType = vType; this.width = def.w; this.height = def.h; 
        this.maxSpeed = def.maxSpeed; this.accel = def.accel; 
        this.friction = def.friction; this.grip = def.grip;
        this.hp = def.hp; this.maxHp = def.hp; this.mass = def.mass;
        this.color = def.colors[Math.floor(Math.random() * def.colors.length)];
        this.dents = []; this.speed = 0;
        this.isParked = false; this.aiDriving = false;
        this.isBroken = false; this.brokenTimer = 0; this.locked = false; 
        this.wheelAngle = 0;
        Game.vehicles.push(this);
    }

    getHitboxes() {
        let boxes = [];
        let numBoxes = Math.max(2, Math.ceil(this.width / 25)); 
        let boxRadius = this.height / 2;
        let step = (this.width - boxRadius*2) / (numBoxes - 1);
        let startX = -(this.width/2) + boxRadius;
        let cos = Math.cos(this.angle); let sin = Math.sin(this.angle);
        for(let i=0; i<numBoxes; i++) {
            let lx = startX + (step * i);
            boxes.push({ x: this.x + cos * lx, y: this.y + sin * lx, r: boxRadius });
        }
        return boxes;
    }

    addDent(worldX, worldY, damage) {
        let dx = worldX - this.x; let dy = worldY - this.y;
        let localX = dx * Math.cos(this.angle) + dy * Math.sin(this.angle);
        let localY = -dx * Math.sin(this.angle) + dy * Math.cos(this.angle);
        localX = Math.max(-this.width/2, Math.min(this.width/2, localX));
        localY = Math.max(-this.height/2, Math.min(this.height/2, localY));
        let radius = Math.min(15, 3 + damage * 0.2); 
        this.dents.push({ x: localX, y: localY, r: radius });
    }

    update(dt) {
        if (!this.active) return;
        
        let isDriven = (Game.player.inVehicle === this);
        let inputAccel = 0; let inputSteer = 0;
        
        if (this.isBroken) {
            this.aiDriving = false; this.brokenTimer += dt;
            if (this.brokenTimer >= 5) { if (isDriven) toggleVehicle(); this.active = false; return; }
        } else if (isDriven && !Game.player.isWorking) {
            this.isParked = false; this.aiDriving = false;
            if (Game.keys['ArrowUp'] || Game.keys['w'] || Game.joystick.y < -0.3) inputAccel = 1;
            if (Game.keys['ArrowDown'] || Game.keys['s'] || Game.joystick.y > 0.3) inputAccel = -0.5;
            if (Game.keys['ArrowLeft'] || Game.keys['a'] || Game.joystick.x < -0.3) inputSteer = -1;
            if (Game.keys['ArrowRight'] || Game.keys['d'] || Game.joystick.x > 0.3) inputSteer = 1;
        }

        // SOLO EL HOST CALCULA LA IA DEL TRÁFICO
        if (this.aiDriving && isHost) {
            let shouldBrake = false;
            let tileX = Math.floor(this.x / TILE_SIZE) * TILE_SIZE; let tileY = Math.floor(this.y / TILE_SIZE) * TILE_SIZE;
            let cx = tileX + TILE_SIZE/2; let cy = tileY + TILE_SIZE/2;
            let distToCenter = Math.hypot(this.x - cx, this.y - cy);
            
            let lookAheadX = this.x + Math.cos(this.angle) * 120; let lookAheadY = this.y + Math.sin(this.angle) * 120;
            let currentRoad = getRoadType(Math.floor(this.x/TILE_SIZE), Math.floor(this.y/TILE_SIZE));
            let nextRoad = getRoadType(Math.floor(lookAheadX/TILE_SIZE), Math.floor(lookAheadY/TILE_SIZE));

            if (nextRoad === 'NONE' && distToCenter < 40) {
                let leftA = this.angle - Math.PI/2; let rightA = this.angle + Math.PI/2;
                let ltx = Math.floor((cx + Math.cos(leftA)*TILE_SIZE)/TILE_SIZE); let lty = Math.floor((cy + Math.sin(leftA)*TILE_SIZE)/TILE_SIZE);
                let rtx = Math.floor((cx + Math.cos(rightA)*TILE_SIZE)/TILE_SIZE); let rty = Math.floor((cy + Math.sin(rightA)*TILE_SIZE)/TILE_SIZE);
                let canLeft = getRoadType(ltx, lty) !== 'NONE'; let canRight = getRoadType(rtx, rty) !== 'NONE';
                
                if (canLeft && !canRight) this.angle = leftA;
                else if (canRight && !canLeft) this.angle = rightA;
                else if (canLeft && canRight) this.angle = Math.random() < 0.5 ? leftA : rightA;
                else { this.angle += Math.PI; this.speed = 0; }
                this.x = cx; this.y = cy; 
            }

            if (currentRoad !== 'INTERSECTION' && nextRoad === 'INTERSECTION') {
                for (let i = 0; i < Game.vehicles.length; i++) {
                    let other = Game.vehicles[i];
                    if (other === this || !other.active) continue;
                    if (getRoadType(Math.floor(other.x/TILE_SIZE), Math.floor(other.y/TILE_SIZE)) === 'INTERSECTION') {
                        if (Math.hypot(other.x - lookAheadX, other.y - lookAheadY) < 150) shouldBrake = true;
                    }
                }
            }
            
            for (let i = 0; i < Game.vehicles.length; i++) {
                let other = Game.vehicles[i];
                if (other === this || !other.active) continue;
                let dx = other.x - this.x, dy = other.y - this.y;
                let fDist = dx * Math.cos(this.angle) + dy * Math.sin(this.angle); 
                let sDist = Math.abs(dx * Math.sin(this.angle) - dy * Math.cos(this.angle)); 
                let safeDist = (this.width/2) + (other.width/2) + 60; 
                if (fDist > 0 && fDist < safeDist && sDist < 40) shouldBrake = true;
            }
            
            if (shouldBrake) {
                this.speed = Math.max(0, this.speed - this.accel * dt * 2.5); 
            } else {
                let cruiseSpeed = this.maxSpeed * 0.45; 
                if (this.speed < cruiseSpeed) this.speed += this.accel * 0.6 * dt;
            }

            if (Math.abs(Math.cos(this.angle)) > 0.5) { 
                let targetY = tileY + (Math.cos(this.angle) > 0 ? 130 : 70); this.y += (targetY - this.y) * 5 * dt;
            } else { 
                let targetX = tileX + (Math.sin(this.angle) > 0 ? 70 : 130); this.x += (targetX - this.x) * 5 * dt;
            }
            this.wheelAngle = 0; 
            
        } else if (!this.aiDriving) {
            let steerSpeed = (1.0 / 3.0) * dt; 
            if (inputSteer !== 0) {
                this.wheelAngle += inputSteer * steerSpeed;
            } else {
                if (this.wheelAngle > 0) this.wheelAngle = Math.max(0, this.wheelAngle - steerSpeed * 1.5);
                if (this.wheelAngle < 0) this.wheelAngle = Math.min(0, this.wheelAngle + steerSpeed * 1.5);
            }
            this.wheelAngle = Math.max(-1, Math.min(1, this.wheelAngle));

            if (inputAccel > 0) this.speed += this.accel * dt;
            else if (inputAccel < 0) this.speed -= this.accel * dt;
            else {
                if (this.speed > 0) this.speed = Math.max(0, this.speed - this.friction * dt);
                if (this.speed < 0) this.speed = Math.min(0, this.speed + this.friction * dt);
            }
            
            if (Math.abs(this.speed) > 2 && !this.isBroken) {
                let speedSign = this.speed > 0 ? 1 : -1;
                let absSpeed = Math.abs(this.speed);
                let speedPct = absSpeed / this.maxSpeed;
                
                let steeringLock = Math.max(0.15, 1.0 - (speedPct * 0.85)); 
                let turnAmount = (absSpeed / this.width) * this.wheelAngle * steeringLock * this.grip * dt * 2.8;
                
                this.angle += turnAmount * speedSign;
            }
        }

        this.speed = Math.max(-this.maxSpeed/2, Math.min(this.maxSpeed, this.speed));
        this.vx = Math.cos(this.angle) * this.speed; 
        this.vy = Math.sin(this.angle) * this.speed;
        super.update(dt);
        
        collideWithWalls(this, dt); 

        let myBoxes = this.getHitboxes();
        for (let i = 0; i < Game.vehicles.length; i++) {
            let other = Game.vehicles[i];
            if (other === this || !other.active) continue;
            let otherBoxes = other.getHitboxes();
            
            let collided = false; let overlap = 0, nx = 0, ny = 0, hX = 0, hY = 0;

            for (let c1 of myBoxes) {
                for (let c2 of otherBoxes) {
                    let dx = c1.x - c2.x; let dy = c1.y - c2.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist === 0) { dx = 1; dist = 1; } 
                    let minDist = c1.r + c2.r;
                    if (dist < minDist) {
                        collided = true; overlap = minDist - dist;
                        nx = dx / dist; ny = dy / dist;
                        hX = c1.x - nx * c1.r; hY = c1.y - ny * c1.r; 
                        break;
                    }
                }
                if (collided) break;
            }

            if (collided) {
                let totalMass = this.mass + other.mass;
                let myMoveRatio = other.mass / totalMass;
                let otherMoveRatio = this.mass / totalMass;

                this.x += nx * overlap * myMoveRatio; this.y += ny * overlap * myMoveRatio;
                other.x -= nx * overlap * otherMoveRatio; other.y -= ny * overlap * otherMoveRatio;
                
                let impact = ((this.vx - other.vx) * nx + (this.vy - other.vy) * ny);
                if (impact < -30) { 
                    this.speed += impact * myMoveRatio; other.speed -= impact * otherMoveRatio; 
                    
                    let myDamage = Math.abs(impact) * other.mass * 0.15;
                    let otherDamage = Math.abs(impact) * this.mass * 0.15;

                    this.hp -= myDamage; other.hp -= otherDamage;
                    this.addDent(hX, hY, myDamage);
                    other.addDent(hX, hY, otherDamage);

                    if (this.hp <= 0) this.isBroken = true;
                    if (other.hp <= 0) { other.isBroken = true; other.aiDriving = false; }
                    if (other.isParked) { other.isParked = false; other.locked = false; }
                }
            }
        }
    }
    
    drawShadow(ctx) {
        if (!this.active) return;
        ctx.save(); 
        ctx.translate(this.x + 4, this.y + 6); 
        ctx.rotate(this.angle);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        if (this.vType === 'MOTO') ctx.fillRect(-this.width/2, -6, this.width, 12);
        else ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        ctx.restore();
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.save(); 
        ctx.translate(this.x, this.y); 
        ctx.rotate(this.angle);

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#111';

        ctx.fillStyle = '#111';
        let isMoto = (this.vType === 'MOTO');
        let isQuad = (this.vType === 'QUAD');
        let isTruck = (this.vType === 'TRUCK');

        let wW = isMoto ? 10 : 12; 
        let wH = isMoto ? 6 : 6;
        let cTurn = this.wheelAngle * (Math.PI / 4);

        if (isMoto) {
            ctx.fillRect(-this.width/2 + 2, -wH/2, wW, wH); 
            ctx.save(); ctx.translate(this.width/2 - 5, 0); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
        } else if (isQuad) {
            let oy = this.height/2 + 2;
            ctx.fillRect(-this.width/2 + 5, -oy - wH/2, wW, wH); ctx.fillRect(-this.width/2 + 5, oy - wH/2, wW, wH); 
            ctx.save(); ctx.translate(this.width/2 - 5, -oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
            ctx.save(); ctx.translate(this.width/2 - 5, oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
        } else if (isTruck) {
            let oy = this.height/2 - 2;
            ctx.fillRect(-this.width/2 + 10, -oy - wH/2, wW, wH); ctx.fillRect(-this.width/2 + 10, oy - wH/2, wW, wH); 
            ctx.fillRect(-this.width/2 + 30, -oy - wH/2, wW, wH); ctx.fillRect(-this.width/2 + 30, oy - wH/2, wW, wH); 
            ctx.save(); ctx.translate(this.width/2 - 15, -oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
            ctx.save(); ctx.translate(this.width/2 - 15, oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
        } else {
            let oy = this.height/2 - 2;
            ctx.fillRect(-this.width/2 + 10, -oy - wH/2, wW, wH); ctx.fillRect(-this.width/2 + 10, oy - wH/2, wW, wH); 
            ctx.save(); ctx.translate(this.width/2 - 15, -oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
            ctx.save(); ctx.translate(this.width/2 - 15, oy); ctx.rotate(cTurn); ctx.fillRect(-wW/2, -wH/2, wW, wH); ctx.restore();
        }

        ctx.fillStyle = this.isBroken ? '#2c3e50' : this.color; 
        
        if (isMoto) {
            ctx.beginPath(); ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.fillRect(-10, -4, 15, 8);
            
            let isDriven = this.aiDriving || (Game.player && Game.player.inVehicle === this);
            if (isDriven && !this.isBroken) {
                ctx.save();
                ctx.translate(-2, 0); 
                ctx.scale(0.75, 0.75); 
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#111';
                let dColor = (Game.player && Game.player.inVehicle === this) ? '#3498db' : '#95a5a6';
                ctx.fillStyle = dColor; 
                ctx.beginPath(); ctx.fillRect(-10, -15, 20, 30); ctx.strokeRect(-10, -15, 20, 30);
                ctx.fillStyle = '#f1c27d'; 
                ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(12, 12, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                ctx.beginPath(); ctx.arc(12, -12, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                ctx.restore();
            }

        } else if (isTruck) {
            ctx.fillRect(-this.width/2, -this.height/2, this.width - 25, this.height); ctx.strokeRect(-this.width/2, -this.height/2, this.width - 25, this.height);
            ctx.fillStyle = this.isBroken ? '#1a252f' : '#ecf0f1';
            ctx.fillRect(this.width/2 - 25, -this.height/2 + 2, 25, this.height - 4); ctx.strokeRect(this.width/2 - 25, -this.height/2 + 2, 25, this.height - 4);
        } else {
            ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
            ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
        }
        
        if (this.dents.length > 0) {
            ctx.save();
            ctx.beginPath();
            if (isMoto) ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI*2);
            else ctx.rect(-this.width/2, -this.height/2, this.width, this.height);
            ctx.clip(); 
            for(let d of this.dents) {
                ctx.fillStyle = 'rgba(20, 20, 20, 0.6)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.5, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        if (!isMoto && !isTruck) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-this.width/4, -this.height/2 + 3, this.width/2, this.height - 6); 
            ctx.fillStyle = this.isBroken ? '#444' : '#87CEEB'; 
            ctx.fillRect(this.width/4, -this.height/2 + 4, 8, this.height - 8); 
            ctx.fillRect(-this.width/4 - 6, -this.height/2 + 4, 6, this.height - 8); 
        }

        if (this.vType === 'POLICE' && !this.isBroken) {
            let time = Date.now();
            let isRed = Math.floor(time / 150) % 2 === 0;
            ctx.fillStyle = isRed ? '#e74c3c' : '#3498db';
            ctx.fillRect(-4, -this.height/2 + 4, 8, this.height - 8);
            if (isRed) { ctx.fillStyle='rgba(231,76,60,0.4)'; ctx.beginPath(); ctx.arc(-4, -this.height/2+6, 20, 0, Math.PI*2); ctx.fill(); }
            else { ctx.fillStyle='rgba(52,152,219,0.4)'; ctx.beginPath(); ctx.arc(-4, this.height/2-6, 20, 0, Math.PI*2); ctx.fill(); }
        }

        if (this.vType === 'TAXI') {
            ctx.fillStyle = '#e67e22'; ctx.fillRect(-6, -6, 12, 12);
        }

        let isNight = Game.timeOfDay >= 18 || Game.timeOfDay < 6;
        let isEngineRunning = this.aiDriving || (Game.player.inVehicle === this);
        
        if (!this.isBroken && isNight && isEngineRunning) { 
            let hw = this.height/2;
            ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
            ctx.beginPath(); ctx.moveTo(this.width/2, -hw + 5); ctx.lineTo(this.width/2 + 250, -hw + 60); ctx.lineTo(this.width/2 + 250, -hw - 50); ctx.fill();
            ctx.beginPath(); ctx.moveTo(this.width/2, hw - 5); ctx.lineTo(this.width/2 + 250, hw + 50); ctx.lineTo(this.width/2 + 250, hw - 60); ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 150, 0.5)';
            ctx.beginPath(); ctx.arc(this.width/2, -hw + 5, isMoto?4:8, 0, Math.PI*2); ctx.fill();
            if (!isMoto) { ctx.beginPath(); ctx.arc(this.width/2, hw - 5, 8, 0, Math.PI*2); ctx.fill(); }
        }
        
        if (this.isBroken) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.8)'; ctx.beginPath(); ctx.arc(this.width/3, 0, 8 + Math.random()*4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(241, 196, 15, 0.7)'; ctx.beginPath(); ctx.arc(this.width/3, 0, 4 + Math.random()*3, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

class Bullet extends Entity {
    constructor() { super(0, 0, 3); this.active = false; this.life = 0; }
    fire(x, y, angle, isPlayer) {
        this.x = x; this.y = y; this.angle = angle;
        this.vx = Math.cos(angle) * 800; this.vy = Math.sin(angle) * 800;
        this.active = true; this.life = 1.5; this.isPlayer = isPlayer;
    }
    update(dt) {
        if (!this.active) return;
        this.life -= dt; if (this.life <= 0) { this.active = false; return; }
        super.update(dt);
        
        let tile = getTile(this.x, this.y);
        if (tile === TYPES.BUILDING) { this.active = false; return; }
        
        for (let i=0; i<Game.vehicles.length; i++) {
            let v = Game.vehicles[i];
            if (!v.active) continue;
            let hitboxes = v.getHitboxes();
            for(let box of hitboxes) {
                if (Math.hypot(this.x - box.x, this.y - box.y) < box.r + this.radius) {
                    v.hp -= 20; 
                    v.addDent(this.x, this.y, 25); 
                    if (v.hp <= 0) { v.isBroken = true; v.aiDriving = false; }
                    this.active = false; return;
                }
            }
        }

        if (this.isPlayer) {
            for (let i=0; i<Game.npcs.length; i++) {
                let npc = Game.npcs[i];
                if (npc.active && Math.hypot(this.x - npc.x, this.y - npc.y) < npc.radius) {
                    npc.active = false; this.active = false; 
                    if (!npc.isPolice) Game.wantedLevel += 1;
                    return;
                }
            }
        } else {
            let target = Game.player.inVehicle ? Game.player.inVehicle : Game.player;
            if (target.active && Math.hypot(this.x - target.x, this.y - target.y) < target.radius) {
                Game.player.hp -= Game.player.inVehicle ? 2 : 10;
                this.active = false; return;
            }
        }
    }
    draw(ctx) { if(this.active){ ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();} }
}

window.handleAction = function() {
    if (Game.player.isWorking) return;
    
    if (Game.jobAgencyLoc && !Game.player.inVehicle) {
        let dist = Math.hypot(Game.player.x - Game.jobAgencyLoc.x, Game.player.y - Game.jobAgencyLoc.y);
        if (dist < 80) {
            let menu = document.getElementById('job-menu');
            if (menu.style.display === 'block') menu.style.display = 'none';
            else { menu.style.display = 'block'; updateJobMenu(); }
            return;
        }
    }
    toggleVehicle();
};

function updateJobMenu() {
    let xpNext = XP_REQ[Game.player.jobLevel] === 999999 ? "MAX" : XP_REQ[Game.player.jobLevel];
    let html = `<h2>Agencia de Empleo</h2>`;
    html += `<p style="text-align:center; color:#bdc3c7; margin-bottom:15px; font-size:14px;">Nivel Laboral: <strong style="color:#f1c40f">${Game.player.jobLevel}</strong> | EXP: ${Math.floor(Game.player.jobXp)}/${xpNext}</p>`;
    
    JOBS.forEach(j => {
        let locked = Game.player.jobLevel < j.level;
        html += `<div class="job-item ${locked ? 'locked' : ''}" onclick="startJob('${j.id}')">
            <strong style="color:${locked ? '#7f8c8d' : '#3498db'}">${j.name} (Nivel ${j.level})</strong><br>
            <span style="font-size:12px; color:#bdc3c7;">Sueldo: $${j.pay} | Tiempo: ${j.time}s</span>
            ${locked ? '<span style="float:right;">🔒</span>' : ''}
        </div>`;
    });
    html += `<button id="btn-close-jobs" onclick="document.getElementById('job-menu').style.display='none'">CERRAR</button>`;
    document.getElementById('job-menu').innerHTML = html;
}

window.startJob = function(jobId) {
    let job = JOBS.find(j => j.id === jobId);
    if (Game.player.jobLevel < job.level) return;
    
    document.getElementById('job-menu').style.display = 'none';
    Game.player.currentJob = job;
    
    Game.player.jobState = 'GO_TO_HQ';
    Game.player.targetLoc = job.hq;
    Game.player.jobData = { hq: job.hq, tasksDone: 0, vehicle: null };
};

window.addEventListener('keydown', e => { 
    Game.keys[e.key] = true; 
    if((e.key==='j' || e.key==='J')) handleAction();
    if(e.key===' ' && !Game.player.inVehicle && !Game.player.enteringVehicle) shoot(Game.player); 
    if(e.key==='e'||e.key==='E') handleAction(); 
});
window.addEventListener('keyup', e => { Game.keys[e.key] = false; });

function shoot(shooter) {
    if (shooter.isPlayer && (!shooter.hasWeapon || shooter.isWorking)) return;
    let bullet = null;
    for(let i=0; i<Game.bullets.length; i++) { if(!Game.bullets[i].active) { bullet = Game.bullets[i]; break; } }
    if (!bullet) { bullet = new Bullet(); Game.bullets.push(bullet); }
    bullet.fire(shooter.x + Math.cos(shooter.angle)*18, shooter.y + Math.sin(shooter.angle)*18, shooter.angle, shooter === Game.player); 
}

function toggleVehicle() {
    if (Game.player.isWorking) return; 

    if (Game.player.inVehicle) {
        let v = Game.player.inVehicle;
        let ejectDist = v.width/2 + 20; 
        let ejectX = v.x - Math.cos(v.angle + Math.PI/2) * ejectDist; 
        let ejectY = v.y - Math.sin(v.angle + Math.PI/2) * ejectDist;
        let tile = getTile(ejectX, ejectY);
        
        if (tile === TYPES.BUILDING || tile === TYPES.WATER) {
            ejectX = v.x + Math.cos(v.angle + Math.PI/2) * ejectDist; 
            ejectY = v.y + Math.sin(v.angle + Math.PI/2) * ejectDist;
            tile = getTile(ejectX, ejectY);
            if (tile === TYPES.BUILDING || tile === TYPES.WATER) {
                ejectX = v.x - Math.cos(v.angle) * ejectDist; ejectY = v.y - Math.sin(v.angle) * ejectDist;
            }
        }
        
        Game.player.x = ejectX; Game.player.y = ejectY;
        Game.player.inVehicle = null; v.locked = false; 
    } else if (!Game.player.enteringVehicle) {
        let closest = null; let minDist = 80;
        for (let i=0; i<Game.vehicles.length; i++) {
            let v = Game.vehicles[i];
            if (!v.active || v.isBroken) continue; 
            let d = Math.hypot(Game.player.x - v.x, Game.player.y - v.y);
            if (d < minDist) { minDist = d; closest = v; }
        }
        if (closest) { 
            // AVISAR A LA RED QUE ROBÉ ESTE COCHE
            if(socket) socket.emit('claimVehicle', closest.id);
            
            if (closest.locked) {
                Game.player.enteringVehicle = closest;
                Game.player.enterTimer = 0.8; 
                Game.wantedLevel += 0.5; 
            } else {
                Game.player.inVehicle = closest; closest.speed = 0; closest.aiDriving = false; 
            }
        }
    }
}

// ==========================================
// SPAWN DE MUNDO (SÓLO EL HOST CREA EL TRÁFICO)
// ==========================================
function manageSpawning() {
    if (!isHost) return; // LOS CLIENTES NORMALES NO CREAN COCHES

    let viewW = width / Game.camera.zoom; let viewH = height / Game.camera.zoom;
    let maxVisibleRadius = Math.hypot(viewW/2, viewH/2);
    let safeRadius = maxVisibleRadius + 200; 

    for (let i = Game.npcs.length - 1; i >= 0; i--) {
        let n = Game.npcs[i];
        if (!n.active || Math.hypot(n.x - Game.camera.x, n.y - Game.camera.y) > safeRadius + 1500) Game.npcs.splice(i, 1);
    }
    for (let i = Game.vehicles.length - 1; i >= 0; i--) {
        let v = Game.vehicles[i];
        if (!v.active || (v !== Game.player.inVehicle && Math.hypot(v.x - Game.camera.x, v.y - Game.camera.y) > safeRadius + 2000)) Game.vehicles.splice(i, 1);
    }

    if (Game.npcs.length < 20) {
        let rx = Game.camera.x + (Math.random() - 0.5) * (safeRadius * 2 + 1000);
        let ry = Game.camera.y + (Math.random() - 0.5) * (safeRadius * 2 + 1000);
        if (getTileType(Math.floor(rx/TILE_SIZE), Math.floor(ry/TILE_SIZE)) !== TYPES.BUILDING && 
            Math.hypot(rx - Game.camera.x, ry - Game.camera.y) > safeRadius) {
            new Person(rx, ry);
        }
    }

    if (Game.vehicles.length < 16) {
        let rx = Game.camera.x + (Math.random() - 0.5) * (safeRadius * 2 + 1500);
        let ry = Game.camera.y + (Math.random() - 0.5) * (safeRadius * 2 + 1500);
        let tx = Math.floor(rx / TILE_SIZE), ty = Math.floor(ry / TILE_SIZE);
        let road = getRoadType(tx, ty);
        
        if (road !== 'NONE' && road !== 'INTERSECTION' && Math.hypot(rx - Game.camera.x, ry - Game.camera.y) > safeRadius) {
            let isClear = true;
            for(let i=0; i<Game.vehicles.length; i++) {
                if(Math.hypot(Game.vehicles[i].x - rx, Game.vehicles[i].y - ry) < 150) { isClear = false; break; }
            }
            if (isClear) {
                let isTown = isTownArea(tx, ty);
                let randomType = SPAWN_POOL[Math.floor(Math.random() * SPAWN_POOL.length)];
                let v = new Vehicle(0, 0, randomType);
                
                if (road === 'HORIZONTAL') {
                    let goRight = Math.random() < 0.5;
                    if (isTown && Math.random() < 0.3 && randomType !== 'POLICE') {
                        v.isParked = true; v.speed = 0; v.locked = true; 
                        v.x = rx; v.y = ty * TILE_SIZE + (goRight ? 175 : 25); v.angle = goRight ? 0 : Math.PI;
                    } else {
                        v.aiDriving = true; v.locked = false;
                        v.x = rx; v.y = ty * TILE_SIZE + (goRight ? 130 : 70); v.angle = goRight ? 0 : Math.PI;
                        v.speed = (v.maxSpeed * 0.4) + Math.random() * 50; 
                    }
                } else if (road === 'VERTICAL') {
                    let goDown = Math.random() < 0.5;
                    if (isTown && Math.random() < 0.3 && randomType !== 'POLICE') {
                        v.isParked = true; v.speed = 0; v.locked = true; 
                        v.y = ry; v.x = tx * TILE_SIZE + (goDown ? 25 : 175); v.angle = goDown ? Math.PI/2 : -Math.PI/2;
                    } else {
                        v.aiDriving = true; v.locked = false;
                        v.y = ry; v.x = tx * TILE_SIZE + (goDown ? 70 : 130); v.angle = goDown ? Math.PI/2 : -Math.PI/2;
                        v.speed = (v.maxSpeed * 0.4) + Math.random() * 50;
                    }
                }
            }
        }
    }
}
