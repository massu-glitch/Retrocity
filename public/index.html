// RED MMO (LÓGICA INYECTADA)
// ==========================================
let socket = null;
let myId = null;
let onlinePlayers = {};
let isHost = false;

function update(dt) {
    if (Game.player.hp <= 0) {
        let respawnPoint = findSafeSpawn(Game.player.x, Game.player.y);
        Game.player.hp = 100; Game.player.stamina = 100; Game.wantedLevel = 0;
        Game.player.x = respawnPoint.x; Game.player.y = respawnPoint.y;
        if (Game.player.inVehicle) { Game.player.inVehicle.aiDriving = false; Game.player.inVehicle.speed = 0; Game.player.inVehicle = null; }
        
        Game.player.isWorking = false; 
        Game.player.currentJob = null;
        Game.player.targetLoc = null;
        Game.player.jobState = 'NONE';
        document.getElementById('working-overlay').style.display = 'none';

        Game.player.enteringVehicle = null; Game.player.enterTimer = 0;
    }

    let target = Game.player.inVehicle ? Game.player.inVehicle : Game.player;

    let dpadUI = document.getElementById('dpad');
    let leftTouchUI = document.getElementById('left-touch');
    if (Game.player.inVehicle) {
        if (dpadUI.style.display !== 'block') {
            dpadUI.style.display = 'block';
            leftTouchUI.style.display = 'none';
            Game.joystick.active = false; Game.joystick.x = 0; Game.joystick.y = 0;
        }
    } else {
        if (dpadUI.style.display === 'block') {
            dpadUI.style.display = 'none';
            leftTouchUI.style.display = 'block';
            Game.keys['ArrowUp'] = false; Game.keys['ArrowDown'] = false; 
            Game.keys['ArrowLeft'] = false; Game.keys['ArrowRight'] = false;
        }
    }

    let isBeingChased = false; let activeCops = 0;
    for(let i=0; i<Game.npcs.length; i++) {
        let npc = Game.npcs[i];
        if (npc.isPolice && npc.active) {
            activeCops++; if (Math.hypot(npc.x - target.x, npc.y - target.y) < 400) isBeingChased = true;
        }
    }

    if (Game.wantedLevel > 0 && !isBeingChased) Game.wantedLevel -= dt * 0.05;
    if (Game.wantedLevel < 0 || isNaN(Game.wantedLevel)) Game.wantedLevel = 0;
    if (Game.wantedLevel > 5) Game.wantedLevel = 5;

    Game.camera.zoom += (Game.camera.zoomTarget - Game.camera.zoom) * 5 * dt;

    if (Game.player.inVehicle) {
        let v = Game.player.inVehicle;
        let offsetDist = Math.min(v.speed * 0.8, (width / Game.camera.zoom) * 0.4); 
        Game.camera.offsetX += (Math.cos(v.angle) * offsetDist - Game.camera.offsetX) * 2 * dt;
        Game.camera.offsetY += (Math.sin(v.angle) * offsetDist - Game.camera.offsetY) * 2 * dt;
    } else {
        Game.camera.offsetX += (0 - Game.camera.offsetX) * 5 * dt;
        Game.camera.offsetY += (0 - Game.camera.offsetY) * 5 * dt;
    }

    Game.camera.x += ((target.x + Game.camera.offsetX) - Game.camera.x) * 4 * dt;
    Game.camera.y += ((target.y + Game.camera.offsetY) - Game.camera.y) * 4 * dt;

    manageSpawning();

    if (activeCops < Math.floor(Game.wantedLevel) && Math.random() < 0.05) {
        let angle = Math.random() * Math.PI * 2;
        let safeRadius = Math.hypot(width / Game.camera.zoom / 2, height / Game.camera.zoom / 2) + 150; 
        let px = Game.camera.x + Math.cos(angle) * safeRadius; let py = Game.camera.y + Math.sin(angle) * safeRadius;
        if (getTile(px, py) !== TYPES.BUILDING && getTile(px, py) !== TYPES.WATER) {
            let cop = new Person(px, py); cop.isPolice = true; cop.color = '#2980b9'; 
        }
    }
    
    for (let i=0; i<Game.npcs.length; i++) {
        let npc = Game.npcs[i];
        if (npc.isPolice && npc.active && Game.wantedLevel > 0 && Math.hypot(npc.x-target.x, npc.y-target.y)<300 && Math.random()<0.02) shoot(npc);
    }

    let distToAgency = Math.hypot(Game.player.x - Game.jobAgencyLoc.x, Game.player.y - Game.jobAgencyLoc.y);
    let prompt = document.getElementById('interaction-prompt');
    let actionBtn = document.getElementById('btn-action');
    
    if (distToAgency < 80 && !Game.player.inVehicle && !Game.player.isWorking) {
        prompt.style.display = 'block';
        actionBtn.innerHTML = 'EMPLEOS'; actionBtn.style.background = 'rgba(52, 152, 219, 0.8)';
    } else {
        prompt.style.display = 'none';
        actionBtn.innerHTML = 'ENTRAR<br>SALIR'; actionBtn.style.background = 'rgba(52, 152, 219, 0.4)';
    }

    Game.player.update(dt);
    for(let i=0; i<Game.vehicles.length; i++) Game.vehicles[i].update(dt);
    for(let i=0; i<Game.npcs.length; i++) Game.npcs[i].update(dt);
    for(let i=0; i<Game.bullets.length; i++) Game.bullets[i].update(dt);

    Game.timeOfDay += dt * (Game.timeOfDay >= 18 || Game.timeOfDay < 6 ? 0.010 : 0.005);
    if (Game.timeOfDay >= 24) Game.timeOfDay -= 24;

    document.getElementById('money-display').innerText = '$' + Game.player.money;
    document.getElementById('health-bar').style.width = Math.max(0, Game.player.hp) + '%';
    document.getElementById('stamina-bar').style.width = Math.max(0, Game.player.stamina) + '%';
    document.getElementById('wanted-stars').innerText = '★'.repeat(Math.max(0, Math.floor(Game.wantedLevel)));
    document.getElementById('damage-overlay').style.boxShadow = Game.player.hp < 40 ? `inset 0 0 100px rgba(255,0,0,${Math.sin(Date.now()*0.005) * 0.5 + 0.2})` : 'inset 0 0 100px rgba(255,0,0,0)';

    // ENVIAR POSICION DEL JUGADOR
    if (socket && Game.player) {
        socket.emit('playerState', {
            x: Game.player.x, y: Game.player.y,
            angle: Game.player.inVehicle ? Game.player.inVehicle.angle : Game.player.angle,
            hp: Game.player.hp, inVehicle: !!Game.player.inVehicle,
            vType: Game.player.inVehicle ? Game.player.inVehicle.vType : null,
            vColor: Game.player.inVehicle ? Game.player.inVehicle.color : null,
            isBroken: Game.player.inVehicle ? Game.player.inVehicle.isBroken : false
        });
        
        // SI SOY EL HOST, ENVÍO EL TRÁFICO A LOS DEMÁS
        if (isHost) {
            let tVehicles = Game.vehicles.filter(v => v.aiDriving || v.isParked).map(v => ({
                id: v.id, x: v.x, y: v.y, angle: v.angle, speed: v.speed, vType: v.vType, 
                color: v.color, isBroken: v.isBroken, aiDriving: v.aiDriving, isParked: v.isParked
            }));
            let tNpcs = Game.npcs.map(n => ({
                id: n.id, x: n.x, y: n.y, angle: n.angle, color: n.color, isPolice: n.isPolice
            }));
            socket.emit('trafficState', { vehicles: tVehicles, npcs: tNpcs });
        }
    }
}

// ==========================================
// RENDERIZADO VISUAL
// ==========================================
function draw() {
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, width, height); ctx.save();
    ctx.translate(width / 2, height / 2); ctx.scale(Game.camera.zoom, Game.camera.zoom); ctx.translate(-Game.camera.x, -Game.camera.y);

    let viewW = width / Game.camera.zoom; let viewH = height / Game.camera.zoom;
    let minX = Game.camera.x - viewW/2 - TILE_SIZE; let maxX = Game.camera.x + viewW/2 + TILE_SIZE;
    let minY = Game.camera.y - viewH/2 - TILE_SIZE; let maxY = Game.camera.y + viewH/2 + TILE_SIZE;

    let startTx = Math.floor(minX / TILE_SIZE), endTx = Math.ceil(maxX / TILE_SIZE);
    let startTy = Math.floor(minY / TILE_SIZE), endTy = Math.ceil(maxY / TILE_SIZE);

    for (let ty = startTy; ty <= endTy; ty++) {
        for (let tx = startTx; tx <= endTx; tx++) {
            let px = tx * TILE_SIZE, py = ty * TILE_SIZE;
            let type = getTileType(tx, ty); 

            if (type === TYPES.ROAD) {
                let road = getRoadType(tx, ty); let isTown = isTownArea(tx, ty);
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1); 
                
                if (road === 'VERTICAL') {
                    ctx.fillStyle = '#ecf0f1'; for(let i=10; i<TILE_SIZE; i+=30) ctx.fillRect(px+TILE_SIZE/2-2, py+i, 4, 15); 
                    if (isTown) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; for(let i=0; i<TILE_SIZE; i+=20) { ctx.fillRect(px+50-1, py+i, 2, 10); ctx.fillRect(px+150-1, py+i, 2, 10); } }
                } else if (road === 'HORIZONTAL') {
                    ctx.fillStyle = '#ecf0f1'; for(let i=10; i<TILE_SIZE; i+=30) ctx.fillRect(px+i, py+TILE_SIZE/2-2, 15, 4); 
                    if (isTown) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; for(let i=0; i<TILE_SIZE; i+=20) { ctx.fillRect(px+i, py+50-1, 10, 2); ctx.fillRect(px+i, py+150-1, 10, 2); } }
                }
            } else if (type === TYPES.SIDEWALK) {
                ctx.fillStyle = '#bdc3c7'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
                ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 4; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                ctx.beginPath(); ctx.moveTo(px + TILE_SIZE/2, py); ctx.lineTo(px + TILE_SIZE/2, py + TILE_SIZE);
                ctx.moveTo(px, py + TILE_SIZE/2); ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE/2); ctx.stroke();
            } else if (type === TYPES.BUILDING) {
                let bColor = BUILDING_COLORS[Math.floor(Math.abs(Math.sin(tx * 1.23 + ty * 3.21) * 100)) % BUILDING_COLORS.length];
                ctx.fillStyle = bColor; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1); 
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(px+15, py+15, TILE_SIZE-20, TILE_SIZE-20);
                ctx.fillStyle = bColor; ctx.fillRect(px+10, py+10, TILE_SIZE-20, TILE_SIZE-20);
                ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(px+10, py+10, TILE_SIZE-20, TILE_SIZE-20);
            } else if (type === TYPES.WATER) {
                ctx.fillStyle = '#2980b9'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
                let wOff = Math.sin(Date.now() * 0.002 + tx + ty) * 10;
                ctx.fillStyle = '#3498db'; ctx.fillRect(px+30 + wOff, py+30, 80, 10); ctx.fillRect(px+90 - wOff, py+80, 60, 10);
            } else if (type === TYPES.TREE) {
                ctx.fillStyle = isTownArea(tx,ty) ? '#bdc3c7' : '#27ae60'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.arc(px+105, py+105, 55, 0, Math.PI*2); ctx.fill(); 
            } else if (type === TYPES.GRASS) {
                ctx.fillStyle = '#27ae60'; ctx.fillRect(px, py, TILE_SIZE+1, TILE_SIZE+1);
            }
        }
    }

    if (Game.jobAgencyLoc) {
        ctx.save();
        ctx.translate(Game.jobAgencyLoc.x, Game.jobAgencyLoc.y);
        ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
        ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#3498db'; ctx.stroke();
        ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('💼', 0, 0);
        ctx.restore();
    }

    if (Game.player.targetLoc) {
        ctx.save();
        ctx.translate(Game.player.targetLoc.x, Game.player.targetLoc.y);
        ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
        ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#e74c3c'; ctx.stroke();
        ctx.restore();
    }

    for(let i=0; i<Game.bullets.length; i++) Game.bullets[i].draw(ctx); 

    let renderList = [];
    if (!Game.player.inVehicle) renderList.push(Game.player);
    for(let i=0; i<Game.npcs.length; i++) if(Game.npcs[i].active) renderList.push(Game.npcs[i]);
    for(let i=0; i<Game.vehicles.length; i++) if(Game.vehicles[i].active) renderList.push(Game.vehicles[i]);
    
    // RENDERIZAR OTROS JUGADORES EN LÍNEA
    if (typeof onlinePlayers !== 'undefined' && myId) {
        for (let id in onlinePlayers) {
            if (id === myId) continue;
            let p = onlinePlayers[id];
            if (!p.x) continue;

            let netEnt = {
                x: p.x, y: p.y, angle: p.angle, hp: p.hp,
                drawShadow: function(ctx) {
                    ctx.save(); ctx.translate(this.x + 4, this.y + 6); ctx.rotate(this.angle);
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    if (p.inVehicle) {
                        let def = VEHICLE_DEFS[p.vType] || {w:60, h:28};
                        if (p.vType === 'MOTO') ctx.fillRect(-def.w/2, -6, def.w, 12);
                        else ctx.fillRect(-def.w/2, -def.h/2, def.w, def.h);
                    } else { ctx.beginPath(); ctx.arc(-1, -1, 12, 0, Math.PI*2); ctx.fill(); }
                    ctx.restore();
                },
                draw: function(ctx) {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                    if (p.inVehicle) {
                        let def = VEHICLE_DEFS[p.vType] || {w:60, h:28}; let w = def.w, h = def.h;
                        ctx.lineWidth = 2; ctx.strokeStyle = '#111';
                        if (p.vType === 'MOTO') {
                            ctx.fillStyle = '#111'; ctx.fillRect(-w/2+2, -3, 10, 6); ctx.fillRect(w/2-5, -3, 10, 6);
                            ctx.fillStyle = p.isBroken ? '#2c3e50' : p.vColor;
                            ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else {
                            ctx.fillStyle = '#111'; ctx.fillRect(-w/2+10, -h/2-3, 12, 6); ctx.fillRect(-w/2+10, h/2-3, 12, 6);
                            ctx.fillRect(w/2-15, -h/2-3, 12, 6); ctx.fillRect(w/2-15, h/2-3, 12, 6);
                            ctx.fillStyle = p.isBroken ? '#2c3e50' : p.vColor;
                            ctx.fillRect(-w/2, -h/2, w, h); ctx.strokeRect(-w/2, -h/2, w, h);
                            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-w/4, -h/2+3, w/2, h-6);
                        }
                    } else {
                        ctx.scale(0.75, 0.75); ctx.lineWidth = 1.5; ctx.strokeStyle = '#111';
                        ctx.fillStyle = '#e67e22'; 
                        ctx.beginPath(); ctx.fillRect(-10, -15, 20, 30); ctx.strokeRect(-10, -15, 20, 30);
                        ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        ctx.beginPath(); ctx.arc(10, 15, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        ctx.beginPath(); ctx.arc(10, -15, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    }
                    ctx.rotate(-this.angle); ctx.fillStyle = '#e67e22'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText("Online", 0, p.inVehicle ? -30 : -20);
                    ctx.restore();
                }
            };
            renderList.push(netEnt);
        }
    }

    for(let ent of renderList) if (ent.drawShadow) ent.drawShadow(ctx);
    renderList.sort((a, b) => a.y - b.y);
    for(let ent of renderList) ent.draw(ctx);
    
    if (Game.player.targetLoc) {
        let pX = Game.player.inVehicle ? Game.player.inVehicle.x : Game.player.x;
        let pY = Game.player.inVehicle ? Game.player.inVehicle.y : Game.player.y;

        let dx = Game.player.targetLoc.x - pX;
        let dy = Game.player.targetLoc.y - pY;
        let dist = Math.hypot(dx, dy);
        
        if (dist > 60) {
            ctx.save();
            ctx.translate(pX, pY);
            ctx.rotate(Math.atan2(dy, dx));
            let offset = Game.player.inVehicle ? (Game.player.inVehicle.width / 2) + 30 : 65;
            ctx.translate(offset, 0); 
            ctx.fillStyle = '#f1c40f'; 
            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, 12); ctx.lineTo(-5, 0); ctx.lineTo(-10, -12); ctx.closePath();
            ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
            ctx.restore();
        }
    }

    for (let ty = startTy; ty <= endTy; ty++) {
        for (let tx = startTx; tx <= endTx; tx++) {
            if (getTileType(tx, ty) === TYPES.TREE) {
                let px = tx * TILE_SIZE, py = ty * TILE_SIZE;
                ctx.fillStyle = '#1e8449'; ctx.beginPath(); ctx.arc(px+100, py+100, 50, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(px+100, py+100, 30, 0, Math.PI*2); ctx.fill();
            }
        }
    }

    ctx.restore();

    let h = Game.timeOfDay; let darkness = 0;
    if (h >= 18 && h < 20) darkness = ((h - 18) / 2) * 0.7; 
    else if (h >= 20 || h < 4) darkness = 0.7; 
    else if (h >= 4 && h < 6) darkness = 0.7 - ((h - 4) / 2 * 0.7); 
    if (darkness > 0) { ctx.fillStyle = `rgba(0, 0, 20, ${darkness})`; ctx.fillRect(0, 0, width, height); }
    
    drawMinimap();
}

function drawMinimap() {
    const MINI_SIZE = 130;
    if (miniCanvas.width !== MINI_SIZE) { miniCanvas.width = MINI_SIZE; miniCanvas.height = MINI_SIZE; }
    miniCtx.clearRect(0, 0, MINI_SIZE, MINI_SIZE); miniCtx.fillStyle = '#1a1a1a'; miniCtx.fillRect(0, 0, MINI_SIZE, MINI_SIZE);
    miniCtx.save();
    miniCtx.translate(MINI_SIZE / 2, MINI_SIZE / 2); const miniScale = 0.035; miniCtx.scale(miniScale, miniScale);
    let target = Game.player.inVehicle ? Game.player.inVehicle : Game.player;
    miniCtx.translate(-target.x, -target.y);
    let viewDist = (MINI_SIZE / 2) / miniScale; 
    let startX = Math.floor((target.x - viewDist) / TILE_SIZE), endX = Math.ceil((target.x + viewDist) / TILE_SIZE);
    let startY = Math.floor((target.y - viewDist) / TILE_SIZE), endY = Math.ceil((target.y + viewDist) / TILE_SIZE);

    for (let y = startY; y <= endY; y++) {
        for (let x = startX; x <= endX; x++) {
            let type = getTileType(x, y);
            if (type === TYPES.ROAD) { miniCtx.fillStyle = '#555'; } else if (type === TYPES.SIDEWALK) { miniCtx.fillStyle = '#888'; }
            else if (type === TYPES.WATER) { miniCtx.fillStyle = '#2980b9'; } else if (type === TYPES.BUILDING) { miniCtx.fillStyle = '#333'; } 
            else if (type === TYPES.TREE) { miniCtx.fillStyle = '#145a32'; } else if (type === TYPES.GRASS) { miniCtx.fillStyle = '#27ae60'; }
            miniCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE+1, TILE_SIZE+1);
        }
    }
    miniCtx.fillStyle = '#3498db'; 
    for(let i=0; i<Game.npcs.length; i++) if (Game.npcs[i].active && Game.npcs[i].isPolice) { miniCtx.beginPath(); miniCtx.arc(Game.npcs[i].x, Game.npcs[i].y, 100, 0, Math.PI * 2); miniCtx.fill(); }
    
    if (typeof onlinePlayers !== 'undefined' && myId) {
        miniCtx.fillStyle = '#e67e22'; 
        for (let id in onlinePlayers) {
            if (id === myId) continue;
            let op = onlinePlayers[id];
            if (op.x) { miniCtx.beginPath(); miniCtx.arc(op.x, op.y, 130, 0, Math.PI * 2); miniCtx.fill(); }
        }
    }

    if (Game.jobAgencyLoc) {
        miniCtx.fillStyle = '#3498db'; 
        miniCtx.beginPath(); miniCtx.arc(Game.jobAgencyLoc.x, Game.jobAgencyLoc.y, 250, 0, Math.PI * 2); miniCtx.fill();
    }

    if (Game.player.targetLoc) {
        miniCtx.fillStyle = '#f1c40f'; 
        miniCtx.beginPath(); miniCtx.arc(Game.player.targetLoc.x, Game.player.targetLoc.y, 150, 0, Math.PI * 2); miniCtx.fill();
    }

    miniCtx.restore();
    miniCtx.fillStyle = '#e74c3c'; miniCtx.beginPath(); miniCtx.arc(MINI_SIZE / 2, MINI_SIZE / 2, 4, 0, Math.PI * 2); miniCtx.fill();
    miniCtx.lineWidth = 1.5; miniCtx.strokeStyle = '#fff'; miniCtx.stroke();
    
    miniCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    miniCtx.font = 'bold 10px Courier New';
    miniCtx.textAlign = 'center';
    miniCtx.fillText(`X:${Math.floor(target.x)} Y:${Math.floor(target.y)}`, MINI_SIZE / 2, MINI_SIZE - 8);
}

function loop(timestamp) {
    let dt = (timestamp - Game.lastTime) / 1000;
    if (isNaN(dt) || dt <= 0) dt = 0.016; if (dt > 0.1) dt = 0.1;
    Game.lastTime = timestamp; update(dt); draw(); requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    for(let i=0; i<30; i++) Game.bullets.push(new Bullet());
    
    generateJobHQs();

    Game.player = new Person(Game.jobAgencyLoc.x, Game.jobAgencyLoc.y + 100, true);
    Game.camera.x = Game.player.x; Game.camera.y = Game.player.y;
    Game.lastTime = performance.now(); requestAnimationFrame(loop);

    // =====================================
    // CONEXION AL SERVIDOR AL DARLE A JUGAR
    // =====================================
    socket = io();
    socket.on('connect', () => { myId = socket.id; });
    
    socket.on('hostStatus', status => { isHost = status; });
    
    socket.on('vehicleClaimed', vid => {
        let v = Game.vehicles.find(veh => veh.id === vid);
        if(v) { v.aiDriving = false; v.isParked = false; }
    });

    socket.on('updateState', (state) => { 
        onlinePlayers = state.players; 
        
        // Si NO soy el host, copio los vehículos y peatones que me manda el host
        if (!isHost && state.traffic && state.traffic.vehicles) {
            
            let sIds = state.traffic.vehicles.map(v => v.id);
            for (let i = Game.vehicles.length - 1; i >= 0; i--) {
                let v = Game.vehicles[i];
                if ((v.aiDriving || v.isParked) && !sIds.includes(v.id)) Game.vehicles.splice(i, 1);
            }
            
            for (let t of state.traffic.vehicles) {
                let v = Game.vehicles.find(veh => veh.id === t.id);
                if (!v) {
                    v = new Vehicle(t.x, t.y, t.vType, t.id);
                    v.color = t.color;
                }
                v.x = t.x; v.y = t.y; v.angle = t.angle; v.speed = t.speed; 
                v.aiDriving = t.aiDriving; v.isParked = t.isParked; v.isBroken = t.isBroken;
            }
            
            let nIds = state.traffic.npcs.map(n => n.id);
            for (let i = Game.npcs.length - 1; i >= 0; i--) {
                let n = Game.npcs[i];
                if (!nIds.includes(n.id)) Game.npcs.splice(i, 1);
            }
            
            for (let t of state.traffic.npcs) {
                let n = Game.npcs.find(npc => npc.id === t.id);
                if (!n) {
                    n = new Person(t.x, t.y, false, t.id);
                    n.color = t.color; n.isPolice = t.isPolice;
                }
                n.x = t.x; n.y = t.y; n.angle = t.angle;
            }
        }
    });
});
</script>
